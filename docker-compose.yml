# =============================================================================
# E-Learning — Docker Compose
#
# 2 cách chạy:
#   1) Phát triển hằng ngày (khuyên dùng):
#        docker compose up -d            -> chỉ chạy PostgreSQL + pgAdmin
#        npm run dev                      -> Next.js chạy trực tiếp trên máy (hot reload nhanh)
#
#   2) Chạy thử bản production giống hệt trên VPS:
#        docker compose --profile app up -d --build
#                                         -> thêm migrate (chạy migration) + app (Next.js build sẵn)
#
# Mọi biến ${...} lấy từ file .env cùng thư mục (copy từ .env.example).
# =============================================================================

name: elearning

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — cơ sở dữ liệu chính
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: elearning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # Chỉ mở cho chính máy này (127.0.0.1), không lộ ra mạng ngoài
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # pgAdmin — giao diện web quản lý database
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: elearning-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Tự khai báo sẵn kết nối tới container "db" khi mở pgAdmin lần đầu
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # migrate — chạy "prisma migrate deploy" một lần rồi tự thoát
  # (chỉ chạy khi bật profile "app")
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    container_name: elearning-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # app — Next.js bản production (chỉ chạy khi bật profile "app")
  # ---------------------------------------------------------------------------
  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    container_name: elearning-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Ghi đè DATABASE_URL trong .env: trong mạng Docker, host là "db" chứ không phải localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      AUTH_TRUST_HOST: "true"
      TZ: Asia/Ho_Chi_Minh
      # File tải lên (ảnh bìa, PDF...) lưu trong volume "uploads" — không mất khi build lại image
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  pgadmin-data:
  uploads:
