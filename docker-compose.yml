# =============================================================================
# docker-compose.yml — MÔI TRƯỜNG LẬP TRÌNH (chạy trên máy Mac)
#
#   db      : PostgreSQL 17 — database chính
#   pgadmin : giao diện web quản lý database  -> http://localhost:5050
#   app     : Next.js chạy chế độ dev          -> http://localhost:3000
#
# Lệnh chính:  docker compose up -d       (bật tất cả)
#              docker compose up -d db pgadmin   (chỉ bật database)
# Mọi giá trị ${...} được lấy từ file .env cùng thư mục.
# =============================================================================
name: elearning

services:
  db:
    image: postgres:17-alpine
    container_name: elearning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # Chỉ mở cho chính máy Mac (127.0.0.1), máy khác trong mạng không vào được
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Dữ liệu được lưu trong volume "pgdata" -> tắt/xoá container không mất dữ liệu
      - pgdata:/var/lib/postgresql/data
      # Script SQL chạy MỘT LẦN khi database được tạo lần đầu
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: elearning-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      # Khai báo sẵn kết nối tới "db" để mở pgAdmin là thấy database luôn
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: dev
    container_name: elearning-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Trong mạng Docker, database có tên máy là "db" (không phải localhost)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Giúp hot reload hoạt động ổn định khi code nằm trên macOS
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app                       # code trên Mac <-> /app trong container
      - node_modules:/app/node_modules   # node_modules để riêng trong Docker (Linux)
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
  node_modules:
  next_cache:
